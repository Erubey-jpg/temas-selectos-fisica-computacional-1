<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" role="img" aria-label="Cuenta en una varilla que gira con omega constante, vista desde arriba: la cuenta esta a una distancia s del eje; su velocidad tiene una componente s punto a lo largo de la varilla y otra omega s perpendicular">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="358" height="278" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>
  <!-- varilla vista desde arriba y su giro -->
  <line x1="42.4" y1="232.5" x2="289.2" y2="90.0" stroke="#333333" stroke-width="5"/>
  <circle cx="90.0" cy="205.0" r="4" fill="#333333" stroke="#333333" stroke-width="1.5"/>
  <path d="M 98.3 174.1 A 32 32 0 0 0 59.1 196.7" fill="none" stroke="#1f5fa8" stroke-width="2"/>
  <text x="56.0" y="171.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-style="italic">ω</tspan></text>

  <!-- la cuenta, a distancia s del eje -->
  <circle cx="219.9" cy="130.0" r="9" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <text x="163.0" y="181.4" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333"><tspan font-style="italic">s</tspan></text>

  <!-- velocidad de la cuenta en N -->
  <line x1="216.9" y1="124.8" x2="268.9" y2="94.8" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="277.9" y="110.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8"><tspan font-style="italic">ṡ</tspan><tspan> </tspan><tspan font-weight="bold">v̂</tspan><tspan font-style="italic" dy="4" font-size="11">x</tspan></text>
  <line x1="219.9" y1="130.0" x2="187.4" y2="73.7" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="181.4" y="65.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8" text-anchor="middle"><tspan font-style="italic">ω</tspan><tspan font-style="italic">s</tspan><tspan> </tspan><tspan font-weight="bold">v̂</tspan><tspan font-style="italic" dy="4" font-size="11">y</tspan></text>
  <text x="180.0" y="262.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#333333" text-anchor="middle">vista desde arriba; la varilla gira con ω constante</text>
</svg>
