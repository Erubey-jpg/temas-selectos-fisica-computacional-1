<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240" role="img" aria-label="Llave de longitud ell sobre n_x con una fuerza F a un angulo phi en su extremo: la componente F cos phi, paralela a la llave, hace trabajo; la componente F sin phi, perpendicular, hace torque; el torque sale de la pagina">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="438" height="238" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>
  <!-- marco N del laboratorio -->
  <line x1="30.0" y1="70.0" x2="70.0" y2="70.0" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha-gris)"/>
  <line x1="30.0" y1="70.0" x2="30.0" y2="30.0" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha-gris)"/>
  <text x="75.0" y="75.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#333333"><tspan font-weight="bold">n̂</tspan><tspan font-style="italic" dy="4" font-size="10">x</tspan></text>
  <text x="24.0" y="22.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#333333"><tspan font-weight="bold">n̂</tspan><tspan font-style="italic" dy="4" font-size="10">y</tspan></text>

  <!-- llave y tuerca; el torque sale de la pagina -->
  <line x1="104.0" y1="140.0" x2="300.0" y2="140.0" stroke="#333333" stroke-width="8"/>
  <circle cx="90.0" cy="140.0" r="15" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <circle cx="90.0" cy="140.0" r="7" fill="none" stroke="#1f5fa8" stroke-width="1.5"/>
  <circle cx="90.0" cy="140.0" r="1.8" fill="#1f5fa8"/>
  <text x="90.0" y="195.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8" text-anchor="middle"><tspan font-weight="bold">τ</tspan><tspan> = </tspan><tspan font-style="italic">ℓF</tspan><tspan> sin </tspan><tspan font-style="italic">φ</tspan><tspan> </tspan><tspan font-weight="bold">n̂</tspan><tspan font-style="italic" dy="4" font-size="11">z</tspan></text>
  <text x="90.0" y="213.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#1f5fa8" text-anchor="middle">(sale de la página)</text>

  <!-- brazo ell -->
  <line x1="90.0" y1="162.0" x2="300.0" y2="162.0" stroke="#999999" stroke-width="1.2" marker-end="url(#flecha-tenue)" marker-start="url(#flecha-tenue)"/>
  <text x="225.0" y="178.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333"><tspan font-style="italic">ℓ</tspan></text>

  <!-- la fuerza y sus dos componentes -->
  <line x1="300.0" y1="140.0" x2="384.3" y2="69.3" stroke="#c0392b" stroke-width="2.5" marker-end="url(#flecha-rojo)"/>
  <text x="390.3" y="67.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b"><tspan font-weight="bold">F</tspan></text>
  <line x1="300.0" y1="140.0" x2="384.3" y2="140.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#flecha-rojo)" stroke-dasharray="5 3"/>
  <line x1="300.0" y1="140.0" x2="300.0" y2="69.3" stroke="#c0392b" stroke-width="1.8" marker-end="url(#flecha-rojo)" stroke-dasharray="5 3"/>
  <path d="M 330.0 140.0 A 30 30 0 0 0 323.0 120.7" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="334.0" y="132.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b"><tspan font-style="italic">φ</tspan></text>
  <text x="342.1" y="162.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b" text-anchor="middle"><tspan font-style="italic">F</tspan><tspan> cos </tspan><tspan font-style="italic">φ</tspan></text>
  <text x="342.1" y="178.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#c0392b" text-anchor="middle">hace trabajo</text>
  <text x="292.0" y="100.6" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b" text-anchor="end"><tspan font-style="italic">F</tspan><tspan> sin </tspan><tspan font-style="italic">φ</tspan></text>
  <text x="292.0" y="116.6" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#c0392b" text-anchor="end">hace torque</text>
</svg>
