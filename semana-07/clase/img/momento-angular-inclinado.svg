<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="340" height="260" role="img" aria-label="Cuerpo con I1 mayor que I3 girando con omega inclinada en el plano b_x b_z: el momento angular H = I . omega no es paralelo a omega, se inclina hacia el eje de mayor momento de inercia">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="338" height="258" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>
  <!-- ejes del cuerpo: b_x, b_z, y b_y saliendo de la pagina -->
  <line x1="60.0" y1="205.0" x2="300.0" y2="205.0" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha-gris)"/>
  <line x1="60.0" y1="205.0" x2="60.0" y2="25.0" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha-gris)"/>
  <text x="305.0" y="210.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#333333"><tspan font-weight="bold">b̂</tspan><tspan font-style="italic" dy="4" font-size="10">x</tspan></text>
  <text x="52.0" y="17.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#333333"><tspan font-weight="bold">b̂</tspan><tspan font-style="italic" dy="4" font-size="10">z</tspan></text>
  <circle cx="60.0" cy="205.0" r="7" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="60.0" cy="205.0" r="1.8" fill="#333333"/>
  <text x="26.0" y="227.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#333333"><tspan font-weight="bold">b̂</tspan><tspan font-style="italic" dy="4" font-size="10">y</tspan></text>

  <!-- omega y H -->
  <line x1="60.0" y1="205.0" x2="140.0" y2="93.0" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="136.0" y="83.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-weight="bold">ω</tspan></text>
  <line x1="60.0" y1="205.0" x2="220.0" y2="115.4" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#flecha-verde)"/>
  <text x="226.0" y="111.4" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#2e8b57"><tspan font-weight="bold">H</tspan><tspan> = </tspan><tspan font-weight="bold">I</tspan><tspan> · </tspan><tspan font-weight="bold">ω</tspan></text>
  <text x="170.0" y="245.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="14" fill="#333333" text-anchor="middle"><tspan font-style="italic">I</tspan><tspan font-style="italic" dy="4" font-size="10">1</tspan><tspan dy="-4"> = 2,  </tspan><tspan font-style="italic">I</tspan><tspan font-style="italic" dy="4" font-size="10">3</tspan><tspan dy="-4"> = 0.8:   </tspan><tspan font-weight="bold">H</tspan><tspan> no es paralelo a </tspan><tspan font-weight="bold">ω</tspan></text>
</svg>
