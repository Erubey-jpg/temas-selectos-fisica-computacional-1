<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-label="Velocidad y aceleracion en polares: la velocidad tiene componentes r punto b_x y r theta punto b_y; la aceleracion tiene r dos puntos b_x, la centripeta -r theta punto al cuadrado b_x hacia el origen, r theta dos puntos b_y y la de Coriolis 2 r punto theta punto b_y">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="618" height="298" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>
  <!-- panel 1: velocidad -->
  <text x="150.0" y="28.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#333333" text-anchor="middle">velocidad</text>
  <line x1="40.0" y1="255.0" x2="240.0" y2="255.0" stroke="#999999" stroke-width="1"/>
  <line x1="40.0" y1="255.0" x2="162.9" y2="169.0" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 80.0 255.0 A 40 40 0 0 0 72.8 232.1" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="86.0" y="247.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b"><tspan font-style="italic">θ</tspan></text>
  <text x="85.4" y="206.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333"><tspan font-style="italic">r</tspan></text>
  <circle cx="40.0" cy="255.0" r="3" fill="#333333" stroke="#333333" stroke-width="1.5"/>
  <circle cx="162.9" cy="169.0" r="8" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <line x1="162.9" y1="169.0" x2="207.9" y2="137.4" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="213.9" y="143.4" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8"><tspan font-style="italic">ṙ</tspan><tspan> </tspan><tspan font-weight="bold">b̂</tspan><tspan font-style="italic" dy="4" font-size="11">x</tspan></text>
  <line x1="162.9" y1="169.0" x2="122.7" y2="111.6" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="116.7" y="103.6" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8" text-anchor="middle"><tspan font-style="italic">r</tspan><tspan font-style="italic">θ</tspan><tspan dx="-7.2" dy="-4">˙</tspan><tspan dx="1.0" dy="4"> </tspan><tspan font-weight="bold">b̂</tspan><tspan font-style="italic" dy="4" font-size="11">y</tspan></text>

  <!-- panel 2: aceleración -->
  <text x="460.0" y="28.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#333333" text-anchor="middle">aceleración</text>
  <line x1="350.0" y1="255.0" x2="550.0" y2="255.0" stroke="#999999" stroke-width="1"/>
  <line x1="350.0" y1="255.0" x2="472.9" y2="169.0" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 390.0 255.0 A 40 40 0 0 0 382.8 232.1" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="396.0" y="247.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b"><tspan font-style="italic">θ</tspan></text>
  <text x="395.4" y="206.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333"><tspan font-style="italic">r</tspan></text>
  <circle cx="350.0" cy="255.0" r="3" fill="#333333" stroke="#333333" stroke-width="1.5"/>
  <circle cx="472.9" cy="169.0" r="8" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <line x1="472.9" y1="169.0" x2="507.3" y2="144.9" stroke="#2e8b57" stroke-width="2" marker-end="url(#flecha-verde)" stroke-dasharray="5 3"/>
  <text x="513.3" y="150.9" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#2e8b57"><tspan font-style="italic">r̈</tspan><tspan> </tspan><tspan font-weight="bold">b̂</tspan><tspan font-style="italic" dy="4" font-size="10">x</tspan></text>
  <line x1="472.9" y1="169.0" x2="415.5" y2="209.1" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#flecha-verde)"/>
  <text x="445.5" y="235.1" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#2e8b57"><tspan>−</tspan><tspan font-style="italic">r</tspan><tspan font-style="italic">θ</tspan><tspan dx="-6.8" dy="-3">˙</tspan><tspan dx="0.9" dy="-4" font-size="10">2</tspan><tspan dy="7"> </tspan><tspan font-weight="bold">b̂</tspan><tspan font-style="italic" dy="4" font-size="10">x</tspan></text>
  <text x="445.5" y="251.1" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#2e8b57">centrípeta</text>
  <line x1="472.9" y1="169.0" x2="451.1" y2="137.8" stroke="#2e8b57" stroke-width="2" marker-end="url(#flecha-verde)" stroke-dasharray="5 3"/>
  <text x="441.1" y="155.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#2e8b57" text-anchor="end"><tspan font-style="italic">r</tspan><tspan font-style="italic">θ</tspan><tspan dx="-6.8" dy="-3">¨</tspan></text>
  <line x1="451.1" y1="137.8" x2="416.7" y2="88.7" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#flecha-verde)"/>
  <text x="412.7" y="66.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#2e8b57" text-anchor="middle"><tspan>2</tspan><tspan font-style="italic">ṙ</tspan><tspan font-style="italic">θ</tspan><tspan dx="-6.8" dy="-3">˙</tspan><tspan dx="0.9" dy="3"> </tspan><tspan font-weight="bold">b̂</tspan><tspan font-style="italic" dy="4" font-size="10">y</tspan></text>
  <text x="412.7" y="82.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#2e8b57" text-anchor="middle">Coriolis</text>
  <line x1="310.0" y1="20.0" x2="310.0" y2="280.0" stroke="#d8d8d3" stroke-width="1"/>
</svg>
