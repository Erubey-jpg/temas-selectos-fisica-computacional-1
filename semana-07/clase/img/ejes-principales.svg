<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="380" height="300" role="img" aria-label="Elipse de inercia x^T I x = 1 en el plano xy: su eje largo, sobre la diagonal (1,1,0), tiene el momento menor I0 - Ip; el corto, sobre (-1,1,0), tiene I0 + Ip; el eje z, con momento 2 I0, sale de la pagina">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="378" height="298" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>
  <!-- ejes de N -->
  <line x1="190.0" y1="145.0" x2="310.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha-gris)"/>
  <line x1="190.0" y1="145.0" x2="190.0" y2="25.0" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha-gris)"/>
  <text x="314.0" y="150.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#333333"><tspan font-weight="bold">n̂</tspan><tspan font-style="italic" dy="4" font-size="10">x</tspan></text>
  <text x="196.0" y="27.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#333333"><tspan font-weight="bold">n̂</tspan><tspan font-style="italic" dy="4" font-size="10">y</tspan></text>

  <!-- elipse x^T I x = 1 con I0 = 2, Ip = 1: semiejes 1 y 1/sqrt(3) -->
  <ellipse cx="190.0" cy="145.0" rx="100" ry="57.7" transform="rotate(-45 190.0 145.0)" fill="none" stroke="#1f5fa8" stroke-width="2"/>

  <!-- ejes principales -->
  <line x1="105.1" y1="229.9" x2="274.9" y2="60.1" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="266.7" y="52.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b"><tspan font-style="italic">I</tspan><tspan font-style="italic" dy="4" font-size="10">0</tspan><tspan dy="-4"> − </tspan><tspan font-style="italic">I</tspan><tspan font-style="italic" dy="4" font-size="10">p</tspan></text>
  <text x="266.7" y="68.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#c0392b">eje (1, 1, 0)</text>
  <line x1="274.9" y1="229.9" x2="105.1" y2="60.1" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="113.3" y="52.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b" text-anchor="end"><tspan font-style="italic">I</tspan><tspan font-style="italic" dy="4" font-size="10">0</tspan><tspan dy="-4"> + </tspan><tspan font-style="italic">I</tspan><tspan font-style="italic" dy="4" font-size="10">p</tspan></text>
  <text x="113.3" y="68.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#c0392b" text-anchor="end">eje (−1, 1, 0)</text>
  <text x="190.0" y="285.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="14" fill="#333333" text-anchor="middle"><tspan>el eje </tspan><tspan font-weight="bold">n̂</tspan><tspan font-style="italic" dy="4" font-size="10">z</tspan><tspan dy="-4"> (momento 2</tspan><tspan font-style="italic">I</tspan><tspan font-style="italic" dy="4" font-size="10">0</tspan><tspan dy="-4">) sale de la página</tspan></text>
</svg>
