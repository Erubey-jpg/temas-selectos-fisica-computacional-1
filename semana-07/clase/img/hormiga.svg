<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Hormiga H que camina por la varilla del pendulo a una distancia s del pivote: su velocidad es el arrastre de la varilla, s theta punto a_x, mas su caminata, -s punto a_y, a lo largo de la varilla">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="398" height="298" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>
  <!-- techo y pivote -->
  <line x1="110.0" y1="45.0" x2="190.0" y2="45.0" stroke="#333333" stroke-width="2"/>
  <path d="M 118.0 45.0 L 110.0 37.0 M 128.0 45.0 L 120.0 37.0 M 138.0 45.0 L 130.0 37.0 M 148.0 45.0 L 140.0 37.0 M 158.0 45.0 L 150.0 37.0 M 168.0 45.0 L 160.0 37.0 M 178.0 45.0 L 170.0 37.0 M 188.0 45.0 L 180.0 37.0" stroke="#333333" stroke-width="1"/>
  <circle cx="150.0" cy="45.0" r="5" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="150.0" cy="45.0" r="1.6" fill="#333333"/>
  <line x1="150.0" y1="45.0" x2="150.0" y2="275.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="150.0" y1="45.0" x2="265.0" y2="244.2" stroke="#555555" stroke-width="7"/>
  <path d="M 150.0 81.0 A 36 36 0 0 0 168.0 76.2" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="154.0" y="99.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b"><tspan font-style="italic">θ</tspan></text>

  <!-- la hormiga -->
  <circle cx="225.0" cy="174.9" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
  <text x="211.0" y="176.9" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#c0392b" text-anchor="end"><tspan font-style="italic">H</tspan></text>

  <!-- arrastre, caminata y velocidad total -->
  <line x1="225.0" y1="174.9" x2="285.6" y2="139.9" stroke="#1f5fa8" stroke-width="2" marker-end="url(#flecha-azul)" stroke-dasharray="5 3"/>
  <text x="289.6" y="117.9" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#1f5fa8"><tspan font-style="italic">s</tspan><tspan font-style="italic">θ</tspan><tspan dx="-6.8" dy="-3">˙</tspan><tspan dx="0.9" dy="3"> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="10">x</tspan></text>
  <text x="289.6" y="133.9" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#1f5fa8">arrastre</text>
  <line x1="216.3" y1="179.9" x2="238.8" y2="218.9" stroke="#1f5fa8" stroke-width="2" marker-end="url(#flecha-azul)" stroke-dasharray="5 3"/>
  <text x="230.8" y="230.9" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#1f5fa8" text-anchor="end"><tspan>−</tspan><tspan font-style="italic">ṡ</tspan><tspan> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="10">y</tspan></text>
  <text x="230.8" y="246.9" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#1f5fa8" text-anchor="end">caminata</text>
  <line x1="225.0" y1="174.9" x2="308.1" y2="178.9" stroke="#1f5fa8" stroke-width="3" marker-end="url(#flecha-azul)"/>
  <text x="314.1" y="186.9" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-weight="bold">v</tspan><tspan font-style="italic" dy="4" font-size="12">H</tspan></text>
</svg>
