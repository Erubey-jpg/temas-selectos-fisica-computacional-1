<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-label="Velocidades parciales del pendulo doble: respecto a u1 las dos masas se mueven con L1 a_1x y la segunda varilla se traslada sin girar; respecto a u2 la primera masa no se mueve y la segunda gira alrededor de P1 con L2 a_2x">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="618" height="298" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>
  <!-- panel 1: velocidades parciales respecto a u1 -->
  <text x="155.0" y="30.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" text-anchor="middle"><tspan>respecto a </tspan><tspan font-style="italic">u</tspan><tspan font-style="italic" dy="4" font-size="11">1</tspan><tspan dy="-4">   (con </tspan><tspan font-style="italic">u</tspan><tspan font-style="italic" dy="4" font-size="11">2</tspan><tspan dy="-4"> = 0)</tspan></text>

  <!-- techo y pivote -->
  <line x1="40.0" y1="55.0" x2="120.0" y2="55.0" stroke="#333333" stroke-width="2"/>
  <path d="M 48.0 55.0 L 40.0 47.0 M 58.0 55.0 L 50.0 47.0 M 68.0 55.0 L 60.0 47.0 M 78.0 55.0 L 70.0 47.0 M 88.0 55.0 L 80.0 47.0 M 98.0 55.0 L 90.0 47.0 M 108.0 55.0 L 100.0 47.0 M 118.0 55.0 L 110.0 47.0" stroke="#333333" stroke-width="1"/>
  <circle cx="80.0" cy="55.0" r="5" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="80.0" cy="55.0" r="1.6" fill="#333333"/>
  <line x1="80.0" y1="55.0" x2="80.0" y2="255.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="80.0" y1="55.0" x2="153.4" y2="131.0" stroke="#333333" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.3"/>
  <circle cx="153.4" cy="131.0" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5" opacity="0.3"/>
  <line x1="153.4" y1="131.0" x2="231.7" y2="167.5" stroke="#333333" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.3"/>
  <circle cx="231.7" cy="167.5" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5" opacity="0.3"/>
  <line x1="80.0" y1="55.0" x2="132.8" y2="146.5" stroke="#333333" stroke-width="3"/>
  <circle cx="132.8" cy="146.5" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <line x1="132.8" y1="146.5" x2="211.1" y2="183.0" stroke="#333333" stroke-width="3"/>
  <circle cx="211.1" cy="183.0" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <text x="102.8" y="150.5" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333"><tspan font-style="italic">P</tspan><tspan font-style="italic" dy="4" font-size="12">1</tspan></text>
  <text x="207.1" y="213.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333"><tspan font-style="italic">P</tspan><tspan font-style="italic" dy="4" font-size="12">2</tspan></text>
  <line x1="132.8" y1="146.5" x2="180.4" y2="119.0" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="184.4" y="115.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8"><tspan font-style="italic">L</tspan><tspan font-style="italic" dy="4" font-size="11">1</tspan><tspan dy="-4"> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="11">1x</tspan></text>
  <line x1="211.1" y1="183.0" x2="258.7" y2="155.5" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="262.7" y="151.5" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8"><tspan font-style="italic">L</tspan><tspan font-style="italic" dy="4" font-size="11">1</tspan><tspan dy="-4"> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="11">1x</tspan></text>
  <text x="155.0" y="285.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#999999" text-anchor="middle">la varilla 2 se traslada sin girar</text>

  <!-- panel 2: velocidades parciales respecto a u2 -->
  <text x="465.0" y="30.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" text-anchor="middle"><tspan>respecto a </tspan><tspan font-style="italic">u</tspan><tspan font-style="italic" dy="4" font-size="11">2</tspan><tspan dy="-4">   (con </tspan><tspan font-style="italic">u</tspan><tspan font-style="italic" dy="4" font-size="11">1</tspan><tspan dy="-4"> = 0)</tspan></text>

  <!-- techo y pivote -->
  <line x1="350.0" y1="55.0" x2="430.0" y2="55.0" stroke="#333333" stroke-width="2"/>
  <path d="M 358.0 55.0 L 350.0 47.0 M 368.0 55.0 L 360.0 47.0 M 378.0 55.0 L 370.0 47.0 M 388.0 55.0 L 380.0 47.0 M 398.0 55.0 L 390.0 47.0 M 408.0 55.0 L 400.0 47.0 M 418.0 55.0 L 410.0 47.0 M 428.0 55.0 L 420.0 47.0" stroke="#333333" stroke-width="1"/>
  <circle cx="390.0" cy="55.0" r="5" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="390.0" cy="55.0" r="1.6" fill="#333333"/>
  <line x1="390.0" y1="55.0" x2="390.0" y2="255.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="390.0" y1="55.0" x2="442.8" y2="146.5" stroke="#333333" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.3"/>
  <circle cx="442.8" cy="146.5" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5" opacity="0.3"/>
  <line x1="442.8" y1="146.5" x2="527.6" y2="162.9" stroke="#333333" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.3"/>
  <circle cx="527.6" cy="162.9" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5" opacity="0.3"/>
  <line x1="390.0" y1="55.0" x2="442.8" y2="146.5" stroke="#333333" stroke-width="3"/>
  <circle cx="442.8" cy="146.5" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <line x1="442.8" y1="146.5" x2="521.1" y2="183.0" stroke="#333333" stroke-width="3"/>
  <circle cx="521.1" cy="183.0" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <text x="412.8" y="150.5" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333"><tspan font-style="italic">P</tspan><tspan font-style="italic" dy="4" font-size="12">1</tspan></text>
  <text x="517.1" y="213.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333"><tspan font-style="italic">P</tspan><tspan font-style="italic" dy="4" font-size="12">2</tspan></text>
  <text x="456.8" y="134.5" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-weight="bold">0</tspan></text>
  <line x1="521.1" y1="183.0" x2="544.3" y2="133.1" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="550.3" y="137.1" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#1f5fa8"><tspan font-style="italic">L</tspan><tspan font-style="italic" dy="4" font-size="11">2</tspan><tspan dy="-4"> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="11">2x</tspan></text>
  <text x="465.0" y="285.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="14" fill="#999999" text-anchor="middle"><tspan>solo gira la varilla 2, alrededor de </tspan><tspan font-style="italic">P</tspan><tspan font-style="italic" dy="4" font-size="10">1</tspan></text>
  <line x1="310.0" y1="20.0" x2="310.0" y2="280.0" stroke="#d8d8d3" stroke-width="1"/>
</svg>
