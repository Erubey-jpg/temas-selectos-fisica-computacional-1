<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="Friccion viscosa en el pendulo simple: la fuerza -b v_P apunta contra la velocidad, a lo largo de -a_x; la velocidad parcial de P es L a_x, asi que la fuerza generalizada es -b L^2 por la velocidad angular">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="358" height="298" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>
  <!-- techo y pivote -->
  <line x1="70.0" y1="55.0" x2="150.0" y2="55.0" stroke="#333333" stroke-width="2"/>
  <path d="M 78.0 55.0 L 70.0 47.0 M 88.0 55.0 L 80.0 47.0 M 98.0 55.0 L 90.0 47.0 M 108.0 55.0 L 100.0 47.0 M 118.0 55.0 L 110.0 47.0 M 128.0 55.0 L 120.0 47.0 M 138.0 55.0 L 130.0 47.0 M 148.0 55.0 L 140.0 47.0" stroke="#333333" stroke-width="1"/>
  <circle cx="110.0" cy="55.0" r="5" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="110.0" cy="55.0" r="1.6" fill="#333333"/>
  <line x1="110.0" y1="55.0" x2="110.0" y2="280.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- recta tangente en P (direccion de a_x) -->
  <line x1="126.8" y1="244.6" x2="282.5" y2="135.7" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="110.0" y1="55.0" x2="204.6" y2="190.2" stroke="#333333" stroke-width="3"/>
  <circle cx="204.6" cy="190.2" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <path d="M 110.0 97.0 A 42 42 0 0 0 134.1 89.4" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="116.0" y="117.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b"><tspan font-style="italic">θ</tspan></text>
  <text x="208.6" y="218.2" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333"><tspan font-style="italic">P</tspan></text>

  <!-- velocidad parcial de P: L a_x -->
  <line x1="204.6" y1="190.2" x2="253.8" y2="155.7" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="249.8" y="143.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-style="italic">L</tspan><tspan> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="12">x</tspan></text>
  <text x="245.8" y="121.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#1f5fa8">velocidad parcial</text>

  <!-- friccion viscosa: -b v_P, a lo largo de -a_x -->
  <line x1="204.6" y1="190.2" x2="159.6" y2="221.7" stroke="#c0392b" stroke-width="2.5" marker-end="url(#flecha-rojo)"/>
  <text x="163.6" y="255.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b"><tspan>−</tspan><tspan font-style="italic">b</tspan><tspan> </tspan><tspan font-weight="bold">v</tspan><tspan font-style="italic" dy="4" font-size="12">P</tspan></text>
</svg>
