<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Pendulo simple con Kane: a la izquierda el peso se proyecta sobre la velocidad parcial L a_x y la tension, perpendicular, no contribuye; a la derecha la aceleracion tiene una parte tangencial L u punto a_x y una centripeta L u^2 a_y, perpendicular, que no contribuye">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="638" height="318" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>  <text x="160.0" y="30.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" text-anchor="middle"><tspan>fuerzas: </tspan><tspan font-style="italic">F</tspan><tspan font-style="italic" dy="4" font-size="11">r</tspan></text>
  <text x="480.0" y="30.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" text-anchor="middle"><tspan>inercia: </tspan><tspan font-style="italic">F</tspan><tspan font-style="italic" dy="4" font-size="11">r</tspan><tspan dy="-11" font-size="11">*</tspan></text>

  <!-- panel izquierdo: peso y tension -->

  <!-- techo y pivote -->
  <line x1="55.0" y1="60.0" x2="135.0" y2="60.0" stroke="#333333" stroke-width="2"/>
  <path d="M 63.0 60.0 L 55.0 52.0 M 73.0 60.0 L 65.0 52.0 M 83.0 60.0 L 75.0 52.0 M 93.0 60.0 L 85.0 52.0 M 103.0 60.0 L 95.0 52.0 M 113.0 60.0 L 105.0 52.0 M 123.0 60.0 L 115.0 52.0 M 133.0 60.0 L 125.0 52.0" stroke="#333333" stroke-width="1"/>
  <circle cx="95.0" cy="60.0" r="5" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="95.0" cy="60.0" r="1.6" fill="#333333"/>
  <line x1="95.0" y1="60.0" x2="95.0" y2="260.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="103.9" y1="229.6" x2="251.3" y2="126.3" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="95.0" y1="60.0" x2="177.6" y2="178.0" stroke="#333333" stroke-width="3"/>
  <circle cx="177.6" cy="178.0" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <path d="M 95.0 98.0 A 38 38 0 0 0 116.8 91.1" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="99.0" y="118.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b"><tspan font-style="italic">θ</tspan></text>
  <line x1="177.6" y1="178.0" x2="222.6" y2="146.4" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="224.6" y="138.4" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-style="italic">L</tspan><tspan> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="12">x</tspan></text>
  <line x1="177.6" y1="178.0" x2="177.6" y2="248.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#flecha-rojo)"/>
  <text x="185.6" y="246.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b"><tspan font-style="italic">m</tspan><tspan font-weight="bold">g</tspan></text>
  <line x1="177.6" y1="178.0" x2="144.7" y2="201.0" stroke="#c0392b" stroke-width="2" marker-end="url(#flecha-rojo)" stroke-dasharray="5 3"/>
  <line x1="177.6" y1="248.0" x2="144.7" y2="201.0" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="140.7" y="221.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#c0392b" text-anchor="end"><tspan>−</tspan><tspan font-style="italic">mg</tspan><tspan> sin </tspan><tspan font-style="italic">θ</tspan><tspan> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="10">x</tspan></text>
  <line x1="170.2" y1="183.1" x2="135.8" y2="134.0" stroke="#c0392b" stroke-width="2" marker-end="url(#flecha-rojo)" stroke-opacity="0.5"/>
  <text x="127.8" y="136.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#c0392b" text-anchor="end" fill-opacity="0.8">tensión:</text>
  <text x="127.8" y="151.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#c0392b" text-anchor="end" fill-opacity="0.8">perpendicular,</text>
  <text x="127.8" y="166.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#c0392b" text-anchor="end" fill-opacity="0.8">no entra</text>
  <text x="160.0" y="300.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" text-anchor="middle"><tspan font-style="italic">F</tspan><tspan font-style="italic" dy="4" font-size="12">r</tspan><tspan dy="-4"> = −</tspan><tspan font-style="italic">mgL</tspan><tspan> sin </tspan><tspan font-style="italic">θ</tspan></text>

  <!-- separador -->
  <line x1="320.0" y1="20.0" x2="320.0" y2="300.0" stroke="#d8d8d3" stroke-width="1"/>

  <!-- panel derecho: aceleracion tangencial y centripeta -->

  <!-- techo y pivote -->
  <line x1="375.0" y1="60.0" x2="455.0" y2="60.0" stroke="#333333" stroke-width="2"/>
  <path d="M 383.0 60.0 L 375.0 52.0 M 393.0 60.0 L 385.0 52.0 M 403.0 60.0 L 395.0 52.0 M 413.0 60.0 L 405.0 52.0 M 423.0 60.0 L 415.0 52.0 M 433.0 60.0 L 425.0 52.0 M 443.0 60.0 L 435.0 52.0 M 453.0 60.0 L 445.0 52.0" stroke="#333333" stroke-width="1"/>
  <circle cx="415.0" cy="60.0" r="5" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="415.0" cy="60.0" r="1.6" fill="#333333"/>
  <line x1="415.0" y1="60.0" x2="415.0" y2="260.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="423.9" y1="229.6" x2="571.3" y2="126.3" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="415.0" y1="60.0" x2="497.6" y2="178.0" stroke="#333333" stroke-width="3"/>
  <circle cx="497.6" cy="178.0" r="10" fill="#8a8a85" stroke="#333333" stroke-width="1.5"/>
  <path d="M 415.0 98.0 A 38 38 0 0 0 436.8 91.1" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="419.0" y="118.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b"><tspan font-style="italic">θ</tspan></text>
  <line x1="497.6" y1="178.0" x2="542.6" y2="146.4" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <text x="544.6" y="138.4" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8"><tspan font-style="italic">L</tspan><tspan> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="12">x</tspan></text>
  <line x1="497.6" y1="178.0" x2="456.6" y2="206.6" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#flecha-verde)"/>
  <text x="452.6" y="226.6" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#2e8b57" text-anchor="end"><tspan font-style="italic">L</tspan><tspan font-style="italic">u̇</tspan><tspan> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="11">x</tspan></text>
  <line x1="490.2" y1="183.1" x2="455.8" y2="134.0" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#flecha-verde)"/>
  <text x="449.8" y="138.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#2e8b57" text-anchor="end"><tspan font-style="italic">L</tspan><tspan font-style="italic">u</tspan><tspan dy="-7" font-size="11">2</tspan><tspan dy="7"> </tspan><tspan font-weight="bold">â</tspan><tspan font-style="italic" dy="4" font-size="11">y</tspan></text>
  <text x="447.8" y="156.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#2e8b57" text-anchor="end">centrípeta:</text>
  <text x="447.8" y="171.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#2e8b57" text-anchor="end">perpendicular,</text>
  <text x="447.8" y="186.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#2e8b57" text-anchor="end">no entra</text>
  <text x="480.0" y="300.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" text-anchor="middle"><tspan font-style="italic">F</tspan><tspan font-style="italic" dy="4" font-size="12">r</tspan><tspan dy="-11" font-size="12">*</tspan><tspan dy="7"> = −</tspan><tspan font-style="italic">mL</tspan><tspan dy="-7" font-size="12">2</tspan><tspan font-style="italic" dy="7">u̇</tspan></text>
</svg>
